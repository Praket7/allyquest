name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Pin TypeScript. Phase 3 will add a lockfile and migration to npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run check
