name: Stage 16 content and campaign
on:
  pull_request:
    paths:
      - 'stage16/**'
      - '.github/workflows/stage16.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: stage16/Source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and test canonical content
        run: |
          node validate-content.cjs
          node validate-content.cjs demo-content.json
          node content-tests.cjs
      - name: Build standalone releases and editor
        run: |
          python build.py
          python build-editor.py
          python build.py demo-content.json ../Ally_Quest_Stage16_Demo.html
      - name: Install pinned browser harness
        run: |
          pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          echo "AQ_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Exact release campaign and regressions
        run: python run-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage16-browser-evidence
          path: stage16/Source/qa/
