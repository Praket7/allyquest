<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ally Quest · Device qualification</title><style>*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#152f3b;color:white}header{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit;padding:8px;border-radius:7px;border:1px solid #567681}button{background:#f5ce83;color:#142f39;font-weight:bold}iframe{width:100%;height:calc(100dvh - 155px);border:0;background:#fff}#status{padding:6px 12px;white-space:pre-wrap}label{display:flex;align-items:center;gap:6px}</style><header><strong>Physical-device test</strong><label>Scene <select id="scene"><option>Exterior</option><option>Interior</option></select></label><label>Device label <input id="device" placeholder="e.g. iPad 10" maxlength="80"></label><button id="start">Start 30 s</button><button id="download" disabled>Export JSON</button></header><div id="status" role="status">Open on the target device, enter the scene, then start recording and play normally for 30 seconds.</div><iframe id="game" title="Ally Quest game" src="Ally_Quest_Stage16_Complete.html"></iframe><script>
'use strict';const $=id=>document.getElementById(id);let running=false,report=null;const percentile=(a,p)=>a.length?[...a].sort((x,y)=>x-y)[Math.min(a.length-1,Math.ceil(a.length*p)-1)]:null;const stats=a=>({count:a.length,median_ms:percentile(a,.5),p95_ms:percentile(a,.95),max_ms:a.length?Math.max(...a):null});$('start').onclick=()=>{if(running)return;let win;try{win=$('game').contentWindow;void win.document.body}catch(e){$('status').textContent='Serve both HTML files from the same local HTTP server.';return;}if(!win.document.body)return;running=true;$('start').disabled=true;$('download').disabled=true;const frame=[],inputs=[],long=[],start=performance.now();let prev=null,hidden=false,observer=null;const visibility=()=>{if(document.hidden)hidden=true};document.addEventListener('visibilitychange',visibility);const input=()=>{const t=win.performance.now();win.requestAnimationFrame(()=>inputs.push(win.performance.now()-t))};for(const e of ['pointerdown','keydown','touchstart'])win.addEventListener(e,input,{passive:true});try{observer=new win.PerformanceObserver(l=>{for(const e of l.getEntries())long.push(e.duration)});observer.observe({type:'longtask',buffered:false})}catch{}const step=t=>{if(prev!==null)frame.push(t-prev);prev=t;const elapsed=performance.now()-start;if(elapsed<30000&&!hidden){$('status').textContent=`Recording ${Math.floor(elapsed/1000)} / 30 s · play normally`;win.requestAnimationFrame(step);return;}for(const e of ['pointerdown','keydown','touchstart'])win.removeEventListener(e,input);document.removeEventListener('visibilitychange',visibility);observer?.disconnect();report={device_label:$('device').value,scene:$('scene').value,user_agent:navigator.userAgent,viewport:[win.innerWidth,win.innerHeight],dpr:win.devicePixelRatio,elapsed_ms:elapsed,visibility_interrupted:hidden,frames:stats(frame),input_to_next_raf:stats(inputs),long_task_ms:observer?stats(long):null,qualification:'operator-recorded; review required',raw:{frame_ms:frame,input_ms:inputs,long_ms:long}};running=false;$('start').disabled=false;$('download').disabled=false;$('status').textContent=JSON.stringify({frames:report.frames,input:report.input_to_next_raf,visibility_interrupted:hidden},null,2)};win.focus();win.requestAnimationFrame(step)};$('download').onclick=()=>{if(!report)return;const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.href=u;a.download='allyquest-device-profile.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
